# The Chutes TDX VM image template: Ubuntu 26.04 LTS with its own kernel (7.0) and systemd (259),
# booted directly as one unified kernel image (no shim, no GRUB, Secure Boot off) on the image's own
# systemd-stub, a read-only erofs root under dm-verity, and an app partition encrypted with plain
# dm-crypt and verified by dm-verity over its ciphertext. `make image` adds the build's own settings
# in mkosi.conf.d/90-build.conf: the app's root hash on the command line (README, "What is measured").

[Config]
# The initrd: mkosi's default one with its code-running extension points masked (mkosi.images/initrd).
Dependencies=initrd

[Distribution]
Distribution=ubuntu
Release=resolute
Architecture=x86-64
Repositories=main,universe
# Every package as of one instant (snapshot.ubuntu.com): two builders install the same bytes. The
# package sources are mkosi.sandbox/etc/apt/sources.list.d/mkosi.sources: resolute, -updates and
# -security, all three from this snapshot (mkosi would take -security from the live archive).
Mirror=https://snapshot.ubuntu.com/ubuntu/20261122T000000Z

[Build]
# Every tool runs from the pinned tools container (build/Containerfile), never from a tools tree
# mkosi would download.
ToolsTree=

[Output]
Format=disk
Output=disk
CompressOutput=no
SplitArtifacts=uki
# disk.manifest: every package and its version (build.sh checks the stub's against the UKI's).
ManifestFormat=json
# Partition UUIDs and other repart metadata derive from this seed (reproducible builds).
Seed=0e8f8a43-5c1d-4b0e-9a7c-2f3b6d1e4c57
# 512-byte sectors, as GCE's disks have: the ESP's FAT must use them too, or the firmware's FAT
# driver (EDK2, as GCE's TDVF) does not mount it and nothing boots. systemd-repart formats an image
# file's filesystems with 4096-byte sectors unless told. (The root's verity keeps 4096-byte blocks:
# mkosi.repart/11-root-verity.conf.)
SectorSize=512

[Validation]
SecureBoot=no

[Content]
Bootable=yes
Bootloader=uki
ShimBootloader=none
# The command line is measured (the UKI's .cmdline, in RTMR1 and RTMR2). roothash= is added by mkosi
# (root verity); chutes.app_roothash= by 90-build.conf. The rest closes inputs the measurement does
# not cover:
#   root=, rootfstype=, systemd.gpt_auto=no   the root by its verity mapping only (no partition
#                                             discovery from EFI variables)
#   efi=noruntime                             no EFI variable reaches Linux (SystemdOptions,
#                                             LoaderDevicePartUUID and the rest are host-writable)
#   systemd.import_credentials=no             no credential from the ESP, SMBIOS, fw_cfg or the
#                                             command line is imported
#   random.trust_bootloader=off               the ESP's random seed is mixed in, never credited
Initrds=%O/initrd.cpio.zst
KernelCommandLine=console=ttyS0 loglevel=3 root=/dev/mapper/root rootfstype=erofs systemd.gpt_auto=no efi=noruntime systemd.import_credentials=no random.trust_bootloader=off
WithDocs=no
WithRecommends=no
CleanPackageMetadata=yes
# systemd-boot-efi: the systemd-stub the UKI is built on (mkosi takes the image's own).
Packages=
        linux-image-virtual
        systemd
        systemd-boot-efi
        systemd-sysv
        systemd-timesyncd
        udev
        dbus
        kmod
        util-linux
        mount
        cryptsetup-bin
# Only the kernel modules this VM needs (and their dependencies): NVMe, dm-verity, erofs, the
# configfs-tsm TDX quote, gVNIC, dm-crypt and its ciphers. In the initrd, what mounts the root.
# mkosi matches each pattern anywhere in the path below /usr/lib/modules/<kver>/kernel/, which has no
# leading slash: a top-level directory is anchored with ^.
KernelModulesExclude=.*
KernelModulesInclude=
        /nvme/host/
        /md/dm-verity
        /md/dm-crypt
        /md/dm-bufio
        ^fs/erofs/
        /virt/coco/
        /google/gve/
        ^arch/x86/crypto/
        ^crypto/
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=
        /nvme/host/nvme
        /md/dm-verity
        /md/dm-bufio
        ^fs/erofs/
RemoveFiles=
        /var/log/*
        /var/cache/*
        /usr/share/doc/*
        /usr/share/man/*
