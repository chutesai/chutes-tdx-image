# The initrd: mkosi's default initrd (its packages and settings, unchanged) with the units masked
# that would run code or mount content from outside the measured UKI, or give a shell
# (mkosi.postinst.chroot here). The main image boots it (Initrds= in ../../mkosi.conf).
[Include]
Include=mkosi-initrd

[Output]
CompressOutput=zstd
